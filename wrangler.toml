name = "makhazin"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Send /api/* to the Worker first; everything else is served as a static file.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "makhazin-waitlist"
database_id = "a8bccfb3-d78d-4586-a138-5440ac13368e"
